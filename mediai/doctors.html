<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Doctors - MediAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a56db;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
            --primary-bg: #eff6ff;
            --primary-gradient: linear-gradient(135deg, #1a56db 0%, #3b82f6 100%);
            --text: #0f172a;
            --text-light: #64748b;
            --white: #ffffff;
            --bg: #f8fafc;
            --shadow: 0 4px 6px rgba(26, 86, 219, 0.07);
            --shadow-lg: 0 10px 40px rgba(26, 86, 219, 0.12);
            --radius: 16px;
            --transition: all 0.3s ease;
            --green: #22c55e;
            --yellow: #f59e0b;
            --red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* Same navbar styles as hospitals page */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            box-shadow: var(--shadow);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: var(--transition);
            border-bottom: 1px solid rgba(26, 86, 219, 0.06);
        }

        .navbar.scrolled {
            padding: 10px 0;
            box-shadow: 0 2px 20px rgba(26, 86, 219, 0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo .stethoscope-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-gradient);
            border-radius: 10px;
            flex-shrink: 0;
        }

        .nav-logo .stethoscope-icon svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .nav-logo .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .nav-logo .logo-text .medi { color: var(--text); }
        .nav-logo .logo-text .ai { color: var(--primary); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--text);
            transition: var(--transition);
            position: relative;
            padding: 4px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2.5px;
            background: var(--primary-gradient);
            border-radius: 2px;
            transition: var(--transition);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a:hover { color: var(--primary); }
        .nav-links a.active { color: var(--primary); }

        .btn-login {
            padding: 8px 24px;
            border: 2px solid var(--primary);
            border-radius: 50px;
            color: var(--primary) !important;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-login:hover {
            background: var(--primary);
            color: var(--white) !important;
        }

        .btn-register {
            padding: 8px 24px;
            background: var(--primary-gradient);
            border-radius: 50px;
            color: var(--white) !important;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 86, 219, 0.4);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            padding: 4px;
        }

        .hamburger span {
            width: 28px;
            height: 3px;
            background: var(--text);
            border-radius: 2px;
            transition: var(--transition);
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            padding: 120px 0 60px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            text-align: center;
        }

        .page-header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .page-header h1 span {
            color: var(--primary);
        }

        .page-header p {
            color: var(--text-light);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== SEARCH & FILTER ===== */
        .search-section {
            padding: 30px 0;
            background: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 80px;
            z-index: 99;
        }

        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group select {
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            background: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ===== DOCTORS GRID ===== */
        .doctors-section {
            padding: 40px 0 80px;
        }

        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .doctor-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .doctor-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .doctor-card .doctor-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .doctor-card .doctor-header .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            font-weight: 700;
            flex-shrink: 0;
        }

        .doctor-card .doctor-header .info h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .doctor-card .doctor-header .info .specialty {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .doctor-card .doctor-header .info .hospital {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .doctor-card .doctor-header .status {
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .doctor-card .doctor-header .status.available {
            background: #dcfce7;
            color: #166534;
        }

        .doctor-card .doctor-header .status.busy {
            background: #fef3c7;
            color: #92400e;
        }

        .doctor-card .doctor-header .status.offline {
            background: #fef2f2;
            color: #991b1b;
        }

        .doctor-card .doctor-body {
            padding: 20px 24px;
        }

        .doctor-card .doctor-body .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .doctor-card .doctor-body .rating .stars {
            color: var(--yellow);
        }

        .doctor-card .doctor-body .rating .reviews {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .doctor-card .doctor-body .doctor-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }

        .doctor-card .doctor-body .doctor-stats .stat {
            text-align: center;
        }

        .doctor-card .doctor-body .doctor-stats .stat .number {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .doctor-card .doctor-body .doctor-stats .stat .label {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .doctor-card .doctor-body .bio {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .doctor-card .doctor-body .doctor-actions {
            display: flex;
            gap: 10px;
        }

        .doctor-card .doctor-body .doctor-actions .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            text-decoration: none;
        }

        .doctor-card .doctor-body .doctor-actions .btn-primary {
            background: var(--primary-gradient);
            color: var(--white);
        }

        .doctor-card .doctor-body .doctor-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3);
        }

        .doctor-card .doctor-body .doctor-actions .btn-secondary {
            background: var(--bg);
            color: var(--text);
        }

        .doctor-card .doctor-body .doctor-actions .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--white);
                padding: 1.5rem;
                box-shadow: var(--shadow-lg);
                gap: 1rem;
                border-radius: 0 0 var(--radius) var(--radius);
            }
            .nav-links.active { display: flex; }
            .hamburger { display: flex; }

            .search-container {
                flex-direction: column;
            }
            .filter-group {
                width: 100%;
            }
            .filter-group select {
                flex: 1;
            }
            .doctors-grid {
                grid-template-columns: 1fr;
            }
            .page-header h1 {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 480px) {
            .doctor-card .doctor-header {
                flex-wrap: wrap;
            }
            .doctor-card .doctor-header .status {
                margin-left: 0;
            }
            .doctor-card .doctor-body .doctor-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="stethoscope-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 8a3 3 0 0 1-3 3h-1.5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h1.5a3 3 0 0 1 3 3v3z"/>
                        <path d="M8.5 8a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h1.5a3 3 0 0 1 3 3v3z"/>
                        <path d="M15 11v3a4 4 0 0 1-8 0v-3"/>
                        <path d="M11 14v4a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-4"/>
                        <path d="M19 11v1a4 4 0 0 1-4 4h-2"/>
                        <circle cx="19" cy="8" r="1"/>
                        <circle cx="8.5" cy="8" r="1"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="medi">Medi</span><span class="ai">AI</span>
                </div>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="hospitals.html">Hospitals</a></li>
                <li><a href="doctors.html" class="active">Doctors</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="btn-login">Login</a></li>
                <li><a href="register.html" class="btn-register">Register</a></li>
            </ul>
            <div class="hamburger" id="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- ===== PAGE HEADER ===== -->
    <section class="page-header">
        <div class="container">
            <h1>Top <span>Doctors</span></h1>
            <p>Connect with experienced healthcare professionals</p>
        </div>
    </section>

    <!-- ===== SEARCH & FILTER ===== -->
    <section class="search-section">
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search doctors by name, specialty, or hospital...">
            </div>
            <div class="filter-group">
                <select id="specialtyFilter">
                    <option value="">All Specialties</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Neurology">Neurology</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Dermatology">Dermatology</option>
                    <option value="Gynecology">Gynecology</option>
                    <option value="Ophthalmology">Ophthalmology</option>
                </select>
                <select id="ratingFilter">
                    <option value="">All Ratings</option>
                    <option value="4.5">4.5+ Stars</option>
                    <option value="4">4+ Stars</option>
                    <option value="3.5">3.5+ Stars</option>
                </select>
                <select id="availabilityFilter">
                    <option value="">All Status</option>
                    <option value="available">Available</option>
                    <option value="busy">Busy</option>
                    <option value="offline">Offline</option>
                </select>
            </div>
        </div>
    </section>

    <!-- ===== DOCTORS GRID ===== -->
    <section class="doctors-section">
        <div class="doctors-grid" id="doctorsGrid">
            <!-- Doctor cards will be dynamically inserted -->
        </div>
    </section>

    <script>
        // ===== MOBILE MENU =====
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            const hamburger = document.getElementById('hamburger');
            navLinks.classList.toggle('active');
            hamburger.classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const nav = document.querySelector('.nav-container');
            const navLinks = document.getElementById('navLinks');
            const hamburger = document.getElementById('hamburger');
            if (!nav.contains(event.target) && navLinks.classList.contains('active')) {
                navLinks.classList.remove('active');
                hamburger.classList.remove('active');
            }
        });

        // ===== NAVBAR SCROLL =====
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // ===== DOCTOR DATA =====
        const doctors = [
            {
                id: 1,
                name: "Dr. Sarah Johnson",
                specialty: "Cardiology",
                hospital: "New York General Hospital",
                rating: 4.9,
                reviews: 450,
                experience: 15,
                patients: 1200,
                avatar: "SJ",
                status: "available",
                bio: "Board-certified cardiologist with 15 years of experience. Specializing in interventional cardiology and preventive heart care."
            },
            {
                id: 2,
                name: "Dr. Michael Chen",
                specialty: "Neurology",
                hospital: "Los Angeles Medical Center",
                rating: 4.8,
                reviews: 380,
                experience: 12,
                patients: 950,
                avatar: "MC",
                status: "busy",
                bio: "Expert neurologist specializing in stroke treatment, epilepsy, and neurodegenerative disorders. Published in leading medical journals."
            },
            {
                id: 3,
                name: "Dr. Emily Rodriguez",
                specialty: "Dermatology",
                hospital: "Chicago Health Institute",
                rating: 4.9,
                reviews: 520,
                experience: 10,
                patients: 800,
                avatar: "ER",
                status: "available",
                bio: "Dermatology specialist with expertise in skin cancer treatment, cosmetic dermatology, and laser therapy. Voted Top Dermatologist 2023."
            },
            {
                id: 4,
                name: "Dr. James Wilson",
                specialty: "Orthopedics",
                hospital: "Boston General Hospital",
                rating: 4.7,
                reviews: 310,
                experience: 14,
                patients: 1100,
                avatar: "JW",
                status: "offline",
                bio: "Orthopedic surgeon specializing in sports medicine, joint replacement, and minimally invasive spine surgery. Team physician for professional sports."
            },
            {
                id: 5,
                name: "Dr. Lisa Park",
                specialty: "Pediatrics",
                hospital: "Miami Health System",
                rating: 4.8,
                reviews: 290,
                experience: 8,
                patients: 650,
                avatar: "LP",
                status: "available",
                bio: "Pediatrician with a focus on child development, adolescent medicine, and pediatric infectious diseases. Mother of two."
            },
            {
                id: 6,
                name: "Dr. Robert Thompson",
                specialty: "Gynecology",
                hospital: "Houston Medical Center",
                rating: 4.6,
                reviews: 340,
                experience: 18,
                patients: 1400,
                avatar: "RT",
                status: "busy",
                bio: "Senior gynecologist with expertise in high-risk pregnancies, fertility treatments, and minimally invasive gynecological surgery."
            }
        ];

        // ===== RENDER DOCTORS =====
        function renderDoctors(filteredDoctors) {
            const grid = document.getElementById('doctorsGrid');
            const doctorsToRender = filteredDoctors || doctors;

            if (doctorsToRender.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                        <i class="fas fa-user-md" style="font-size: 4rem; color: #e2e8f0;"></i>
                        <h3 style="margin-top: 16px; color: var(--text-light);">No doctors found</h3>
                        <p style="color: var(--text-light);">Try adjusting your search filters</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = doctorsToRender.map(doctor => `
                <div class="doctor-card">
                    <div class="doctor-header">
                        <div class="avatar">${doctor.avatar}</div>
                        <div class="info">
                            <h3>${doctor.name}</h3>
                            <div class="specialty">${doctor.specialty}</div>
                            <div class="hospital">${doctor.hospital}</div>
                        </div>
                        <span class="status ${doctor.status}">${doctor.status.charAt(0).toUpperCase() + doctor.status.slice(1)}</span>
                    </div>
                    <div class="doctor-body">
                        <div class="rating">
                            <span class="stars">
                                ${'<i class="fas fa-star"></i>'.repeat(Math.floor(doctor.rating))}
                                ${doctor.rating % 1 >= 0.5 ? '<i class="fas fa-star-half-alt"></i>' : ''}
                            </span>
                            <span class="reviews">${doctor.rating} (${doctor.reviews} reviews)</span>
                        </div>
                        <div class="doctor-stats">
                            <div class="stat">
                                <div class="number">${doctor.experience}+</div>
                                <div class="label">Years Experience</div>
                            </div>
                            <div class="stat">
                                <div class="number">${doctor.patients}+</div>
                                <div class="label">Patients Treated</div>
                            </div>
                            <div class="stat">
                                <div class="number">${doctor.reviews}</div>
                                <div class="label">Reviews</div>
                            </div>
                        </div>
                        <p class="bio">${doctor.bio}</p>
                        <div class="doctor-actions">
                            <a href="#" class="btn btn-primary">Book Appointment</a>
                            <a href="#" class="btn btn-secondary">View Profile</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ===== FILTER DOCTORS =====
        function filterDoctors() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const specialty = document.getElementById('specialtyFilter').value;
            const rating = parseFloat(document.getElementById('ratingFilter').value);
            const availability = document.getElementById('availabilityFilter').value;

            let filtered = doctors.filter(doctor => {
                const matchesSearch = doctor.name.toLowerCase().includes(searchTerm) ||
                                    doctor.specialty.toLowerCase().includes(searchTerm) ||
                                    doctor.hospital.toLowerCase().includes(searchTerm);

                const matchesSpecialty = !specialty || doctor.specialty === specialty;
                const matchesRating = !rating || doctor.rating >= rating;
                const matchesAvailability = !availability || doctor.status === availability;

                return matchesSearch && matchesSpecialty && matchesRating && matchesAvailability;
            });

            renderDoctors(filtered);
        }

        // ===== EVENT LISTENERS =====
        document.getElementById('searchInput').addEventListener('input', filterDoctors);
        document.getElementById('specialtyFilter').addEventListener('change', filterDoctors);
        document.getElementById('ratingFilter').addEventListener('change', filterDoctors);
        document.getElementById('availabilityFilter').addEventListener('change', filterDoctors);

        // ===== INITIAL RENDER =====
        document.addEventListener('DOMContentLoaded', function() {
            renderDoctors();
        });

        console.log('✅ Doctors page loaded successfully!');
    </script>

</body>
</html>
