<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - MediAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a56db;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #1a56db 0%, #3b82f6 100%);
            --text: #0f172a;
            --text-light: #64748b;
            --white: #ffffff;
            --bg: #f8fafc;
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px 32px;
            box-shadow: var(--shadow-lg);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auth-logo .stethoscope-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-gradient);
            border-radius: 12px;
        }

        .auth-logo .stethoscope-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .auth-logo .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .auth-logo .logo-text .medi { color: var(--text); }
        .auth-logo .logo-text .ai { color: var(--primary); }

        .auth-header .role-badge {
            display: inline-block;
            padding: 4px 16px;
            background: #dbeafe;
            color: var(--primary);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .auth-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .auth-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--white);
            color: var(--text);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-light);
            background: none;
            border: none;
            font-size: 1rem;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 24px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-light);
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 86, 219, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-social {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: var(--white);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text);
        }

        .btn-social:hover {
            border-color: var(--primary);
            background: var(--bg);
        }

        .btn-google:hover {
            border-color: #ea4335;
            color: #ea4335;
        }

        .btn-facebook:hover {
            border-color: #1877f2;
            color: #1877f2;
        }

        .auth-footer {
            text-align: center;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert.show {
            display: flex;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .alert-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
        }

        .alert i {
            font-size: 1.1rem;
        }

        .back-home {
            display: inline-block;
            margin-top: 12px;
            color: var(--text-light);
            font-size: 0.9rem;
            text-decoration: none;
            transition: var(--transition);
        }

        .back-home:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 20px;
            }
            .social-login {
                grid-template-columns: 1fr;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <div class="stethoscope-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 8a3 3 0 0 1-3 3h-1.5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h1.5a3 3 0 0 1 3 3v3z"/>
                            <path d="M8.5 8a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h1.5a3 3 0 0 1 3 3v3z"/>
                            <path d="M15 11v3a4 4 0 0 1-8 0v-3"/>
                            <path d="M11 14v4a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-4"/>
                            <path d="M19 11v1a4 4 0 0 1-4 4h-2"/>
                            <circle cx="19" cy="8" r="1"/>
                            <circle cx="8.5" cy="8" r="1"/>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <span class="medi">Medi</span><span class="ai">AI</span>
                    </div>
                </div>
                <span class="role-badge"><i class="fas fa-user-md"></i> Doctor</span>
                <h2>Welcome Back</h2>
                <p>Login to your doctor account</p>
            </div>

            <div id="alertMessage" class="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="alertText">Invalid credentials. Please try again.</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> Remember Me
                    </label>
                    <a href="../forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="auth-divider">or continue with</div>

            <div class="social-login">
                <button class="btn-social btn-google" onclick="socialLogin('google')">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="btn-social btn-facebook" onclick="socialLogin('facebook')">
                    <i class="fab fa-facebook"></i> Facebook
                </button>
            </div>

            <div class="auth-footer">
                Don't have a doctor account? <a href="register.html">Sign Up as Doctor</a>
            </div>
            <div style="text-align: center; margin-top: 12px;">
                <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alertMessage');
            const text = document.getElementById('alertText');
            alert.className = `alert show alert-${type}`;
            text.textContent = message;
        }

        function hideAlert() {
            document.getElementById('alertMessage').className = 'alert';
        }

        function getUsers() {
            const users = localStorage.getItem('mediAI_users');
            if (users) {
                return JSON.parse(users);
            }
            return {
                patient: [
                    { email: 'patient@mediai.com', password: 'patient123', name: 'John Doe' }
                ],
                doctor: [
                    { email: 'doctor@mediai.com', password: 'doctor123', name: 'Dr. Sarah Johnson' }
                ],
                hospital: [
                    { email: 'hospital@mediai.com', password: 'hospital123', name: 'New York General Hospital' }
                ]
            };
        }

        function handleLogin(event) {
            event.preventDefault();
            hideAlert();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!email || !password) {
                showAlert('Please fill in all fields');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showAlert('Please enter a valid email address');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            const allUsers = getUsers();
            const doctorUsers = allUsers.doctor || [];

            const user = doctorUsers.find(u => u.email === email && u.password === password);

            setTimeout(() => {
                if (user) {
                    const userData = {
                        id: Date.now().toString(),
                        name: user.name,
                        email: email,
                        role: 'doctor',
                        loggedIn: true
                    };

                    localStorage.setItem('mediAI_user', JSON.stringify(userData));
                    if (rememberMe) {
                        localStorage.setItem('mediAI_remember', 'true');
                    }

                    showAlert('Login successful! Redirecting...', 'success');
                    btn.innerHTML = '<i class="fas fa-check"></i> Success!';

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    const emailExists = doctorUsers.some(u => u.email === email);
                    if (emailExists) {
                        showAlert('Incorrect password. Please try again.');
                    } else {
                        showAlert('No doctor account found with this email. Please sign up.');
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
            }, 1500);
        }

        function socialLogin(provider) {
            showAlert(`Connecting to ${provider}...`, 'info');
            setTimeout(() => {
                showAlert(`${provider} login coming soon!`, 'info');
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('mediAI_remember') === 'true') {
                document.getElementById('rememberMe').checked = true;
            }
            
            const user = localStorage.getItem('mediAI_user');
            if (user) {
                const userData = JSON.parse(user);
                if (userData.role === 'doctor') {
                    window.location.href = 'dashboard.html';
                }
            }

            console.log('✅ Doctor Login page loaded successfully!');
            console.log('📝 Demo Doctor Credentials:');
            console.log('  Email: doctor@mediai.com');
            console.log('  Password: doctor123');
        });
    </script>

</body>
</html>
