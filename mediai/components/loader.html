<!-- Loading Spinner Component -->
<div class="loader-overlay" id="loaderOverlay">
    <div class="loader-container">
        <div class="loader-spinner">
            <svg viewBox="0 0 50 50">
                <circle class="loader-ring" cx="25" cy="25" r="20" fill="none" stroke-width="4"/>
            </svg>
        </div>
        <div class="loader-text">
            <span>Loading</span>
            <span class="loader-dots">...</span>
        </div>
        <p class="loader-subtext">Please wait while we process your request</p>
    </div>
</div>

<style>
.loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    backdrop-filter: blur(4px);
}

.loader-overlay.active {
    display: flex;
}

.loader-container {
    text-align: center;
    padding: 40px;
    border-radius: 16px;
    background: white;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    animation: scaleIn 0.3s ease;
}

@keyframes scaleIn {
    from {
        transform: scale(0.9);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.loader-spinner {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    animation: spin 1s linear infinite;
}

.loader-ring {
    stroke: var(--primary-color);
    stroke-dasharray: 150;
    stroke-dashoffset: 150;
    animation: dash 1.5s ease-in-out infinite;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}

@keyframes dash {
    0% {
        stroke-dashoffset: 150;
    }
    50% {
        stroke-dashoffset: 35;
    }
    100% {
        stroke-dashoffset: 150;
    }
}

.loader-text {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-color);
    margin-bottom: 8px;
}

.loader-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
}

.loader-subtext {
    color: var(--text-light);
    font-size: 14px;
    margin: 0;
}

/* Smaller loader for inline use */
.loader-small {
    width: 32px;
    height: 32px;
    border: 3px solid #e2e8f0;
    border-top-color: var(--primary-color);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

.loader-small-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
}

.loader-small-wrapper span {
    font-size: 14px;
    color: var(--text-light);
}

/* Skeleton loader */
.skeleton-loader {
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: skeleton-loading 1.5s ease-in-out infinite;
    border-radius: 4px;
}

@keyframes skeleton-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* Progress loader */
.progress-loader {
    width: 100%;
    max-width: 300px;
    height: 4px;
    background: #e2e8f0;
    border-radius: 2px;
    overflow: hidden;
    margin: 16px auto 0;
}

.progress-loader .progress-bar {
    height: 100%;
    background: var(--primary-color);
    border-radius: 2px;
    animation: progress 2s ease-in-out infinite;
}

@keyframes progress {
    0% { width: 0; }
    50% { width: 70%; }
    100% { width: 100%; }
}

/* Usage examples */
.loader-overlay.example-active {
    display: flex;
}

/* Responsive */
@media (max-width: 480px) {
    .loader-container {
        padding: 24px;
        margin: 0 16px;
    }
    
    .loader-text {
        font-size: 18px;
    }
}
</style>

<script>
// Loader control functions
function showLoader(message = 'Loading...') {
    const overlay = document.getElementById('loaderOverlay');
    const text = overlay?.querySelector('.loader-text');
    const subtext = overlay?.querySelector('.loader-subtext');
    
    if (overlay) {
        if (text) {
            text.innerHTML = `<span>${message}</span><span class="loader-dots">...</span>`;
        }
        if (subtext) {
            subtext.textContent = 'Please wait while we process your request';
        }
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
}

function hideLoader() {
    const overlay = document.getElementById('loaderOverlay');
    if (overlay) {
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }
}

function showProgressLoader(message = 'Loading...') {
    const overlay = document.getElementById('loaderOverlay');
    const container = overlay?.querySelector('.loader-container');
    
    if (overlay && container) {
        container.innerHTML = `
            <div class="loader-text">${message}</div>
            <div class="progress-loader">
                <div class="progress-bar"></div>
            </div>
            <p class="loader-subtext">Please wait while we process your request</p>
        `;
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
}

// Auto-hide loader after timeout (for demo)
function autoHideLoader(delay = 5000) {
    setTimeout(() => {
        hideLoader();
    }, delay);
}

// Global loader functions
window.showLoader = showLoader;
window.hideLoader = hideLoader;
window.showProgressLoader = showProgressLoader;
window.autoHideLoader = autoHideLoader;
</script>
