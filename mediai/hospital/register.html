<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Registration - MediAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a56db;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #1a56db 0%, #3b82f6 100%);
            --text: #0f172a;
            --text-light: #64748b;
            --white: #ffffff;
            --bg: #f8fafc;
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 520px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px 32px;
            box-shadow: var(--shadow-lg);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .auth-logo .stethoscope-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-gradient);
            border-radius: 12px;
        }

        .auth-logo .stethoscope-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .auth-logo .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .auth-logo .logo-text .medi { color: var(--text); }
        .auth-logo .logo-text .ai { color: var(--primary); }

        .auth-header .role-badge {
            display: inline-block;
            padding: 4px 16px;
            background: #dbeafe;
            color: var(--primary);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .auth-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .auth-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--white);
            color: var(--text);
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-light);
            background: none;
            border: none;
            font-size: 1rem;
        }

        .password-strength {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .password-strength .strength-bar {
            flex: 1;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength .strength-bar .fill {
            height: 100%;
            transition: var(--transition);
        }

        .password-strength .strength-text {
            font-size: 0.75rem;
            color: var(--text-light);
            min-width: 60px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 16px 0 20px;
        }

        .terms input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            margin-top: 2px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .terms label {
            font-size: 0.9rem;
            color: var(--text-light);
            cursor: pointer;
        }

        .terms a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 86, 219, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            color: var(--text-light);
            font-size: 0.95rem;
            margin-top: 20px;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert.show {
            display: flex;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .alert i {
            font-size: 1.1rem;
        }

        .back-home {
            display: inline-block;
            margin-top: 12px;
            color: var(--text-light);
            font-size: 0.9rem;
            text-decoration: none;
            transition: var(--transition);
        }

        .back-home:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <div class="stethoscope-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 8a3 3 0 0 1-3 3h-1.5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h1.5a3 3 0 0 1 3 3v3z"/>
                            <path d="M8.5 8a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h1.5a3 3 0 0 1 3 3v3z"/>
                            <path d="M15 11v3a4 4 0 0 1-8 0v-3"/>
                            <path d="M11 14v4a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-4"/>
                            <path d="M19 11v1a4 4 0 0 1-4 4h-2"/>
                            <circle cx="19" cy="8" r="1"/>
                            <circle cx="8.5" cy="8" r="1"/>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <span class="medi">Medi</span><span class="ai">AI</span>
                    </div>
                </div>
                <span class="role-badge"><i class="fas fa-hospital"></i> Hospital</span>
                <h2>Create Hospital Account</h2>
                <p>Join MediAI as a hospital</p>
            </div>

            <div id="alertMessage" class="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="alertText">Please fill in all required fields.</span>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Hospital Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-hospital input-icon"></i>
                        <input type="text" id="hospitalName" placeholder="Enter hospital name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="phone" placeholder="Enter phone number" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <div class="input-wrapper">
                            <i class="fas fa-city input-icon"></i>
                            <input type="text" id="city" placeholder="City" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <div class="input-wrapper">
                            <i class="fas fa-map-marker-alt input-icon"></i>
                            <input type="text" id="state" placeholder="State" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-location-dot input-icon"></i>
                        <input type="text" id="address" placeholder="Street address" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Hospital Type</label>
                    <div class="input-wrapper">
                        <i class="fas fa-building input-icon"></i>
                        <select id="hospitalType" style="width:100%; padding:12px 14px 12px 44px; border:2px solid #e2e8f0; border-radius:10px; font-size:0.95rem; background:white;">
                            <option value="">Select Hospital Type</option>
                            <option value="general">General Hospital</option>
                            <option value="specialty">Specialty Hospital</option>
                            <option value="teaching">Teaching Hospital</option>
                            <option value="community">Community Hospital</option>
                            <option value="private">Private Hospital</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Number of Beds</label>
                    <div class="input-wrapper">
                        <i class="fas fa-bed input-icon"></i>
                        <input type="number" id="beds" placeholder="Total beds" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Create a password" required oninput="checkPasswordStrength()">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="fill" id="strengthFill" style="width:0%;"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Weak</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    </div>
                </div>

                <div class="terms">
                    <input type="checkbox" id="termsCheck" required>
                    <label for="termsCheck">
                        I agree to the <a href="../terms.html">Terms of Service</a> and <a href="../privacy.html">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn-primary" id="registerBtn">
                    <i class="fas fa-user-plus"></i> Create Hospital Account
                </button>
            </form>

            <div class="auth-footer">
                Already have a hospital account? <a href="login.html">Sign In</a>
            </div>
            <div style="text-align: center; margin-top: 12px;">
                <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            const percentages = [0, 20, 40, 60, 80, 100];
            const colors = ['#e2e8f0', '#ef4444', '#f59e0b', '#f59e0b', '#22c55e', '#22c55e'];
            const labels = ['', 'Very Weak', 'Weak', 'Medium', 'Strong', 'Very Strong'];

            fill.style.width = percentages[strength] + '%';
            fill.style.background = colors[strength];
            text.textContent = labels[strength];
            text.style.color = colors[strength];
        }

        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alertMessage');
            const text = document.getElementById('alertText');
            alert.className = `alert show alert-${type}`;
            text.textContent = message;
        }

        function hideAlert() {
            document.getElementById('alertMessage').className = 'alert';
        }

        function getUsers() {
            const users = localStorage.getItem('mediAI_users');
            if (users) {
                return JSON.parse(users);
            }
            return {
                patient: [
                    { email: 'patient@mediai.com', password: 'patient123', name: 'John Doe' }
                ],
                doctor: [
                    { email: 'doctor@mediai.com', password: 'doctor123', name: 'Dr. Sarah Johnson' }
                ],
                hospital: [
                    { email: 'hospital@mediai.com', password: 'hospital123', name: 'New York General Hospital' }
                ]
            };
        }

        function saveUsers(users) {
            localStorage.setItem('mediAI_users', JSON.stringify(users));
        }

        function handleRegister(event) {
            event.preventDefault();
            hideAlert();

            const hospitalName = document.getElementById('hospitalName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const city = document.getElementById('city').value.trim();
            const state = document.getElementById('state').value.trim();
            const address = document.getElementById('address').value.trim();
            const hospitalType = document.getElementById('hospitalType').value;
            const beds = document.getElementById('beds').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('termsCheck').checked;

            if (!hospitalName || !email || !phone || !city || !state || !address || !hospitalType || !beds || !password || !confirmPassword) {
                showAlert('Please fill in all fields');
                return;
            }

            if (hospitalName.length < 2) {
                showAlert('Hospital name must be at least 2 characters');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showAlert('Please enter a valid email address');
                return;
            }

            if (phone.length < 10) {
                showAlert('Please enter a valid phone number');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match');
                return;
            }

            if (!terms) {
                showAlert('Please agree to the Terms of Service');
                return;
            }

            const allUsers = getUsers();
            let emailExists = false;
            for (const role in allUsers) {
                if (allUsers[role].some(u => u.email === email)) {
                    emailExists = true;
                    break;
                }
            }
            
            if (emailExists) {
                showAlert('An account with this email already exists. Please sign in.');
                return;
            }

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

            setTimeout(() => {
                const newUser = {
                    email: email,
                    password: password,
                    name: hospitalName,
                    phone: phone,
                    city: city,
                    state: state,
                    address: address,
                    hospitalType: hospitalType,
                    beds: beds,
                    registeredAt: new Date().toISOString()
                };

                allUsers.hospital.push(newUser);
                saveUsers(allUsers);

                const userData = {
                    id: Date.now().toString(),
                    name: newUser.name,
                    email: email,
                    role: 'hospital',
                    loggedIn: true
                };

                localStorage.setItem('mediAI_user', JSON.stringify(userData));

                showAlert('Hospital account created successfully! Redirecting...', 'success');
                btn.innerHTML = '<i class="fas fa-check"></i> Success!';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            }, 2000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('mediAI_user');
            if (user) {
                const userData = JSON.parse(user);
                if (userData.role === 'hospital') {
                    window.location.href = 'dashboard.html';
                }
            }
            console.log('✅ Hospital Registration page loaded successfully!');
        });
    </script>

</body>
</html>
