<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Admin Dashboard</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/images/logos/logo.png" alt="MediAI" class="sidebar-logo">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="users.html"><i class="fas fa-users"></i> Users</a></li>
                    <li><a href="hospitals.html"><i class="fas fa-hospital"></i> Hospitals</a></li>
                    <li class="active"><a href="doctors.html"><i class="fas fa-user-md"></i> Doctors</a></li>
                    <li><a href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a></li>
                    <li><a href="outbreaks.html"><i class="fas fa-virus"></i> Outbreaks</a></li>
                    <li><a href="feedback.html"><i class="fas fa-comments"></i> Feedback</a></li>
                    <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1>Doctor Management</h1>
                    <p>Manage registered doctors</p>
                </div>
            </header>

            <section class="doctors-section">
                <div class="search-filter">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search doctors...">
                    </div>
                    <select>
                        <option value="">All Specialties</option>
                        <option value="cardiology">Cardiology</option>
                        <option value="neurology">Neurology</option>
                        <option value="orthopedics">Orthopedics</option>
                    </select>
                </div>

                <div class="doctors-grid">
                    <div class="doctor-card">
                        <div class="doctor-avatar">
                            <img src="../assets/images/doctors/doctor1.jpg" alt="Doctor">
                        </div>
                        <div class="doctor-info">
                            <h4>Dr. Sarah Johnson</h4>
                            <p>Cardiologist</p>
                            <p class="hospital">New York General Hospital</p>
                            <div class="doctor-actions">
                                <button class="btn-secondary btn-sm">Profile</button>
                                <button class="btn-primary btn-sm">Verify</button>
                            </div>
                        </div>
                    </div>
                    <div class="doctor-card">
                        <div class="doctor-avatar">
                            <img src="../assets/images/doctors/doctor2.jpg" alt="Doctor">
                        </div>
                        <div class="doctor-info">
                            <h4>Dr. Michael Chen</h4>
                            <p>Neurologist</p>
                            <p class="hospital">Los Angeles Medical Center</p>
                            <div class="doctor-actions">
                                <button class="btn-secondary btn-sm">Profile</button>
                                <button class="btn-primary btn-sm">Verify</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../assets/js/app.js"></script>
</body>
</html>
