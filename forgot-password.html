<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MediAI</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <img src="assets/images/logos/logo.png" alt="MediAI" class="auth-logo">
                <h2>Reset Password</h2>
                <p>Enter your email to receive reset instructions</p>
            </div>
            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-block">Send Reset Link</button>
                <p class="auth-footer"><a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
            </form>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
</body>
</html>
